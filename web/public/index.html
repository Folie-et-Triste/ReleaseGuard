<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReleaseGuard</title>
<style>
/* GitHub Primer theme. Same look as the prototype, now talking to a real backend. */
:root{
  --canvas:#ffffff;--subtle:#f6f8fa;--border:#d0d7de;--border-muted:#d8dee4;
  --fg:#1f2328;--fg-muted:#656d76;--accent:#0969da;--accent-subtle:#ddf4ff;
  --ok:#1a7f37;--ok-emph:#1f883d;--ok-subtle:#dafbe1;--ok-border:#aceebb;
  --done:#8250df;--danger:#cf222e;--danger-emph:#cf222e;--danger-subtle:#ffebe9;--danger-border:#ffcecb;
  --attention:#9a6700;--attention-emph:#bf8700;--attention-subtle:#fff8c5;--attention-border:#eac54f;
  --header-bg:#24292f;--header-fg:#fff;--header-muted:#b7bdc8;
  --btn-bg:#f6f8fa;--btn-border:#d0d7de;--btn-fg:#24292f;--btn-hover:#eef1f4;
  --tab-active:#fd8c73;--shadow:0 1px 0 rgba(31,35,40,.04);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0d1117;--subtle:#161b22;--border:#30363d;--border-muted:#21262d;
  --fg:#e6edf3;--fg-muted:#7d8590;--accent:#2f81f7;--accent-subtle:#121d2f;
  --ok:#3fb950;--ok-emph:#238636;--ok-subtle:#122117;--ok-border:#2ea04366;
  --done:#a371f7;--danger:#f85149;--danger-emph:#da3633;--danger-subtle:#2b1618;--danger-border:#f8514966;
  --attention:#d29922;--attention-emph:#9e6a03;--attention-subtle:#221d10;--attention-border:#bb800966;
  --header-bg:#161b22;--header-fg:#e6edf3;--header-muted:#7d8590;
  --btn-bg:#21262d;--btn-border:#30363d;--btn-fg:#c9d1d9;--btn-hover:#30363d;--shadow:0 0 transparent;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --canvas:#0d1117;--subtle:#161b22;--border:#30363d;--border-muted:#21262d;
  --fg:#e6edf3;--fg-muted:#7d8590;--accent:#2f81f7;--accent-subtle:#121d2f;
  --ok:#3fb950;--ok-emph:#238636;--ok-subtle:#122117;--ok-border:#2ea04366;
  --done:#a371f7;--danger:#f85149;--danger-emph:#da3633;--danger-subtle:#2b1618;--danger-border:#f8514966;
  --attention:#d29922;--attention-emph:#9e6a03;--attention-subtle:#221d10;--attention-border:#bb800966;
  --header-bg:#161b22;--header-fg:#e6edf3;--header-muted:#7d8590;
  --btn-bg:#21262d;--btn-border:#30363d;--btn-fg:#c9d1d9;--btn-hover:#30363d;--shadow:0 0 transparent;color-scheme:dark;
}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{margin:0;font-weight:600}svg{fill:currentColor;vertical-align:text-bottom}
:focus-visible{outline:2px solid var(--accent);outline-offset:-1px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.app{min-height:100%;display:flex;flex-direction:column}
.ghead{background:var(--header-bg);color:var(--header-fg);padding:0 16px;height:60px;display:flex;align-items:center;gap:14px}
.ghead .mark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;color:var(--header-fg)}
.ghead .mark svg{width:30px;height:30px}.ghead .spacer{flex:1}
.ghead .hu{display:flex;align-items:center;gap:8px;color:var(--header-muted);font-size:13px}
.ghead .avatar{width:26px;height:26px;border-radius:50%;background:#30363d;color:#fff;display:grid;place-items:center;font-size:12px;border:1px solid rgba(255,255,255,.12)}
.ghead .ticon{background:none;border:none;color:var(--header-muted);width:30px;height:30px;display:grid;place-items:center;border-radius:6px}
.ghead .ticon:hover{color:#fff;background:rgba(255,255,255,.08)}
.subnav{background:var(--canvas);border-bottom:1px solid var(--border);padding:0 16px}
.subnav .inner{max-width:1012px;margin:0 auto;display:flex;gap:8px}
.tab{display:inline-flex;align-items:center;gap:8px;padding:12px 10px;border:none;background:none;font-size:14px;color:var(--fg);border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none}
.tab:hover{text-decoration:none;border-bottom-color:var(--border)}
.tab.active{font-weight:600;border-bottom-color:var(--tab-active)}
.tab .c{font-size:12px;background:rgba(129,139,152,.2);color:var(--fg-muted);padding:1px 7px;border-radius:2em;font-weight:500}
.page{max-width:1012px;margin:0 auto;padding:24px 16px 72px;width:100%}
.phead{display:flex;align-items:center;gap:16px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.phead h1{font-size:20px}.phead p{margin:2px 0 0;color:var(--fg-muted);font-size:14px}.phead .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:5px 16px;border-radius:6px;border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--btn-fg);font-weight:500;font-size:14px;box-shadow:var(--shadow)}
.btn:hover{background:var(--btn-hover)}
.btn.primary{background:var(--ok-emph);border-color:rgba(27,31,36,.15);color:#fff}.btn.primary:hover{background:var(--ok)}
.btn.sm{padding:3px 12px;font-size:12px}.btn.danger{color:var(--danger)}.btn.danger:hover{background:var(--danger-emph);border-color:var(--danger-emph);color:#fff}
.btn:disabled{opacity:.6;cursor:not-allowed;background:var(--btn-bg)}
.btn.block{width:100%;justify-content:center}
.box{border:1px solid var(--border);border-radius:6px;background:var(--canvas);overflow:hidden}
.box-head{background:var(--subtle);border-bottom:1px solid var(--border);padding:12px 16px;font-size:14px;color:var(--fg-muted);font-weight:500;display:flex;align-items:center;gap:8px}
.box-head b{color:var(--fg);font-weight:600}
.irow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 16px;border-top:1px solid var(--border-muted);width:100%;text-align:left;background:none;border-left:none;border-right:none;border-bottom:none}
.irow:first-of-type{border-top:none}.irow:hover{background:var(--subtle)}.irow .si{margin-top:2px}
.si.ok{color:var(--ok)}.si.hold{color:var(--attention)}.si.done{color:var(--done)}.si.closed{color:var(--danger)}
.irow .ttl{font-size:16px;font-weight:600;color:var(--fg)}.irow:hover .ttl{color:var(--accent)}
.irow .sub{color:var(--fg-muted);font-size:12.5px;margin-top:4px;display:block}.irow .right{display:flex;align-items:center;gap:8px;white-space:nowrap}
.State{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:2em;color:#fff;font-weight:500;font-size:13px;line-height:1}
.State.ok{background:var(--ok-emph)}.State.hold{background:var(--attention-emph)}.State.done{background:var(--done)}.State.closed{background:var(--danger-emph)}
.State.sm{padding:2px 9px;font-size:12px}
.ihead{margin-bottom:8px}.ihead h1{font-size:24px;font-weight:400;line-height:1.25}.ihead h1 .num{color:var(--fg-muted);font-weight:300}
.ihead .statusline{display:flex;align-items:center;gap:10px;margin:12px 0 20px;color:var(--fg-muted);font-size:14px;flex-wrap:wrap}
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--fg-muted);font-size:12.5px;margin-bottom:14px;background:none;border:none;padding:0}
.backlink:hover{color:var(--accent)}
.merge{border:1px solid var(--border);border-radius:6px;margin-bottom:24px;overflow:hidden}
.merge .m-top{display:flex;gap:14px;padding:16px;align-items:flex-start}
.merge .m-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.merge.ok .m-ic{background:var(--ok-emph)}.merge.hold .m-ic{background:var(--attention-emph)}.merge.done .m-ic{background:var(--done)}.merge.closed .m-ic{background:var(--danger-emph)}
.merge .m-title{font-size:16px;font-weight:600}.merge .m-sub{color:var(--fg-muted);font-size:13px;margin-top:2px}
.checks{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--border-muted)}
.checks li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-muted);font-size:13px}
.checks li:last-child{border-bottom:none}.checks .x{color:var(--danger);flex:none}
.checks .k{color:var(--fg-muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-left:auto}
.merge .m-foot{border-top:1px solid var(--border);background:var(--subtle);padding:12px 16px;display:flex;gap:10px}
.group{margin-top:20px}.g-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:8px}
.g-title .c{font-size:12px;color:var(--fg-muted);background:rgba(129,139,152,.18);padding:0 7px;border-radius:2em;font-weight:500}
.lrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--border-muted)}
.lrow:first-of-type{border-top:none}.lrow .lic{color:var(--fg-muted)}.lrow.cleared .lic{color:var(--ok)}
.lrow .nm{display:block;font-weight:500;font-size:14px}.lrow.code .nm{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.lrow.cleared .nm{color:var(--fg-muted)}.lrow .meta{display:block;color:var(--fg-muted);font-size:12px;margin-top:3px}
.label{display:inline-flex;align-items:center;padding:0 10px;height:22px;border-radius:2em;font-size:12px;font-weight:500;border:1px solid transparent}
.label.Critical{color:var(--danger);background:var(--danger-subtle);border-color:var(--danger-border)}
.label.Major{color:var(--attention);background:var(--attention-subtle);border-color:var(--attention-border)}
.label.Minor{color:var(--fg-muted);background:var(--subtle);border-color:var(--border)}
.statetxt{font-size:12px;font-weight:500;white-space:nowrap}.statetxt.open{color:var(--attention)}.statetxt.good{color:var(--ok)}.statetxt.muted{color:var(--fg-muted)}
.add{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--border-muted);background:var(--subtle)}
input[type=text],input[type=password],select,textarea{font-family:inherit;font-size:14px;color:var(--fg);background:var(--canvas);border:1px solid var(--border);border-radius:6px;padding:5px 12px;box-shadow:inset 0 1px 0 rgba(208,215,222,.2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-subtle)}
input.grow{flex:1;min-width:150px}.code-in{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.emptyrow{padding:16px;color:var(--fg-muted);font-size:14px;text-align:center}
.ledger .e{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--border-muted)}
.ledger .e:first-of-type{border-top:none}.ledger .e .ic{color:var(--fg-muted)}.ledger .a b{font-weight:600}.ledger .when{color:var(--fg-muted);font-size:12px;white-space:nowrap}
.scrim{position:fixed;inset:0;background:rgba(1,4,9,.5);display:none;place-items:center;padding:20px;z-index:40}.scrim.show{display:grid}
.dialog{background:var(--canvas);border:1px solid var(--border);border-radius:12px;width:100%;max-width:448px;box-shadow:0 8px 24px rgba(1,4,9,.2);overflow:hidden}
.dialog .d-head{padding:16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}.dialog .d-body{padding:16px}
.dialog .f{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}.dialog label{font-size:13px;font-weight:600}
.dialog .foot{padding:16px;border-top:1px solid var(--border);background:var(--subtle);display:flex;justify-content:flex-end;gap:8px}
/* Auth screen */
.auth{min-height:100%;display:grid;place-items:center;padding:24px;background:var(--subtle)}
.authcard{width:100%;max-width:340px}
.authcard .brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:20px;margin-bottom:20px}
.authcard .brand svg{width:34px;height:34px;color:var(--fg)}
.authbox{border:1px solid var(--border);border-radius:6px;background:var(--canvas);padding:20px}
.authtabs{display:flex;margin-bottom:16px;border-bottom:1px solid var(--border)}
.authtabs button{flex:1;padding:8px;background:none;border:none;border-bottom:2px solid transparent;color:var(--fg-muted);font-weight:500}
.authtabs button.active{color:var(--fg);border-bottom-color:var(--tab-active);font-weight:600}
.authbox .f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.authbox label{font-size:13px;font-weight:600}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
.hint{color:var(--fg-muted);font-size:12px;margin-top:12px;text-align:center}
@media (max-width:640px){.irow{grid-template-columns:auto 1fr}.irow .right{grid-column:2;justify-content:flex-start;margin-top:8px}.ledger .e{grid-template-columns:auto 1fr}.ledger .when{grid-column:2}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const S={issue:'<svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"></path></svg>',
checkCircle:'<svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16Zm3.78-9.72a.75.75 0 0 0-1.06-1.06L6.75 9.19 5.28 7.72a.75.75 0 0 0-1.06 1.06l2 2a.75.75 0 0 0 1.06 0Z"></path></svg>',
xCircle:'<svg viewBox="0 0 16 16" width="16" height="16"><path d="M2.343 13.657A8 8 0 1 1 13.658 2.343 8 8 0 0 1 2.343 13.657ZM6.03 4.97a.75.75 0 0 0-1.06 1.06L6.94 8 4.97 9.97a.75.75 0 1 0 1.06 1.06L8 9.06l1.97 1.97a.75.75 0 1 0 1.06-1.06L9.06 8l1.97-1.97a.75.75 0 1 0-1.06-1.06L8 6.94Z"></path></svg>',
alert:'<svg viewBox="0 0 16 16" width="16" height="16"><path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>',
check:'<svg viewBox="0 0 16 16" width="16" height="16"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"></path></svg>',
circle:'<svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Z"></path></svg>',
merged:'<svg viewBox="0 0 16 16" width="16" height="16"><path d="M5.45 5.154A4.25 4.25 0 0 0 9.25 7.5h1.378a2.251 2.251 0 1 1 0 1.5H9.25A5.734 5.734 0 0 1 5 7.123v3.505a2.25 2.25 0 1 1-1.5 0V5.372a2.25 2.25 0 1 1 1.95-.218ZM4.25 13.5a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm8.5-4a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"></path></svg>',
plus:'<svg viewBox="0 0 16 16" width="15" height="15"><path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"></path></svg>',
back:'<svg viewBox="0 0 16 16" width="14" height="14"><path d="M7.78 12.53a.75.75 0 0 1-1.06 0L2.47 8.28a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 1.06L4.81 7h7.44a.75.75 0 0 1 0 1.5H4.81l2.97 2.97a.75.75 0 0 1 0 1.06Z"></path></svg>',
shield:'<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.3-2.9 7.6-7 9-4.1-1.4-7-4.7-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>'};
const LABEL={ok:"Ready",hold:"Not ready",done:"Approved",closed:"Rejected"};
const SI={ok:S.issue,hold:S.alert,done:S.merged,closed:S.xCircle};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function timeAgo(ts){const d=Math.round((Date.now()-ts)/60000);if(d<1)return"just now";if(d<60)return d+" minutes ago";const h=Math.round(d/60);if(h<24)return h+(h===1?" hour ago":" hours ago");const dy=Math.round(h/24);return dy+(dy===1?" day ago":" days ago");}

let token=null,user=null,view="dashboard",openId=null;
try{token=localStorage.getItem("rg_token");user=localStorage.getItem("rg_user");}catch(e){}

async function api(path,method,body){
  const h={"Content-Type":"application/json"};
  if(token)h["Authorization"]="Bearer "+token;
  const res=await fetch("/api"+path,{method:method||"GET",headers:h,body:body?JSON.stringify(body):undefined});
  if(res.status===401 && token){logout();throw new Error("Session expired");}
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||"Request failed");
  return data;
}
function setTheme(){const cur=document.documentElement.getAttribute("data-theme");const next=cur==="dark"?"light":(cur==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark"));document.documentElement.setAttribute("data-theme",next);}
function logout(){token=null;user=null;try{localStorage.removeItem("rg_token");localStorage.removeItem("rg_user");}catch(e){}renderAuth();}

const appEl=document.getElementById("app");

/* ---------- Auth screen ---------- */
function renderAuth(){
  let mode="login";
  appEl.innerHTML=`
   <div class="auth"><div class="authcard">
     <div class="brand">${S.shield} ReleaseGuard</div>
     <div class="authbox">
       <div class="authtabs"><button data-m="login" class="active">Sign in</button><button data-m="register">Create account</button></div>
       <div class="f"><label for="u">Username</label><input type="text" id="u" autocomplete="username"></div>
       <div class="f"><label for="p">Password</label><input type="password" id="p" autocomplete="current-password"></div>
       <button class="btn primary block" id="go">Sign in</button>
       <div class="err" id="err"></div>
       <div class="hint" id="hint">Passwords need at least 8 characters.</div>
     </div>
   </div></div>`;
  const tabs=appEl.querySelectorAll(".authtabs button");
  const go=appEl.querySelector("#go"), err=appEl.querySelector("#err");
  tabs.forEach(t=>t.onclick=()=>{mode=t.dataset.m;tabs.forEach(x=>x.classList.toggle("active",x===t));go.textContent=mode==="login"?"Sign in":"Create account";err.textContent="";});
  async function submit(){
    err.textContent="";
    const username=appEl.querySelector("#u").value.trim(), password=appEl.querySelector("#p").value;
    if(!username||!password){err.textContent="Enter a username and password.";return;}
    go.disabled=true;
    try{
      const r=await api("/"+mode,"POST",{username,password});
      token=r.token;user=r.user;
      try{localStorage.setItem("rg_token",token);localStorage.setItem("rg_user",user);}catch(e){}
      view="dashboard";openId=null;renderApp();
    }catch(e){err.textContent=e.message;go.disabled=false;}
  }
  go.onclick=submit;
  appEl.querySelector("#p").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
  appEl.querySelector("#u").focus();
}

/* ---------- App shell ---------- */
function renderApp(){
  appEl.innerHTML=`
   <div class="app">
     <header class="ghead">
       <div class="mark">${S.shield} ReleaseGuard</div>
       <div class="spacer"></div>
       <button class="ticon" id="themeBtn" title="Switch theme" aria-label="Switch theme"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0Zm0 13a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13ZM2.343 2.343a.75.75 0 0 1 1.06 0l1.061 1.061a.75.75 0 0 1-1.06 1.06L2.343 3.404a.75.75 0 0 1 0-1.06Zm9.193 9.193a.75.75 0 0 1 1.06 0l1.061 1.06a.75.75 0 0 1-1.06 1.061l-1.061-1.06a.75.75 0 0 1 0-1.061ZM16 8a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 16 8ZM3 8a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 3 8Zm10.657-5.657a.75.75 0 0 1 0 1.06l-1.06 1.061a.75.75 0 1 1-1.061-1.06l1.06-1.061a.75.75 0 0 1 1.061 0ZM4.464 11.536a.75.75 0 0 1 0 1.06l-1.06 1.061a.75.75 0 0 1-1.061-1.06l1.06-1.061a.75.75 0 0 1 1.061 0Z"></path></svg></button>
       <div class="hu"><span class="avatar">${esc((user||"?")[0])}</span><span>${esc(user)}</span></div>
       <button class="ticon" id="logoutBtn" title="Sign out" aria-label="Sign out"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 2.75C2 1.784 2.784 1 3.75 1h2.5a.75.75 0 0 1 0 1.5h-2.5a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h2.5a.75.75 0 0 1 0 1.5h-2.5A1.75 1.75 0 0 1 2 13.25Zm10.44 4.5-1.97-1.97a.749.749 0 0 1 1.06-1.06l3.25 3.25a.749.749 0 0 1 0 1.06l-3.25 3.25a.749.749 0 1 1-1.06-1.06l1.97-1.97H6.75a.75.75 0 0 1 0-1.5Z"></path></svg></button>
     </header>
     <nav class="subnav"><div class="inner">
       <a href="#" class="tab" data-view="dashboard">${S.issue} Releases <span class="c" id="relCount"></span></a>
       <a href="#" class="tab" data-view="history">${S.circle} Activity</a>
     </div></nav>
     <main class="page"><div id="root"><div class="emptyrow">Loading…</div></div></main>
   </div>
   <div class="scrim" id="newScrim"><div class="dialog" role="dialog" aria-modal="true"><div class="d-head">Open a new release</div><div class="d-body"><div class="f"><label for="nver">Version</label><input type="text" id="nver" class="code-in" placeholder="2.4.0"></div><div class="f"><label for="ndesc">Description</label><input type="text" id="ndesc" placeholder="November feature release"></div></div><div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="newCreate">Create release</button></div></div></div>
   <div class="scrim" id="rejScrim"><div class="dialog" role="dialog" aria-modal="true"><div class="d-head">Reject release</div><div class="d-body"><div class="f"><label for="rreason">Reason</label><textarea id="rreason" rows="3" placeholder="Checkout smoke test still failing."></textarea></div></div><div class="foot"><button class="btn" data-close>Cancel</button><button class="btn danger" id="rejConfirm">Reject release</button></div></div></div>`;
  appEl.querySelector("#themeBtn").onclick=setTheme;
  appEl.querySelector("#logoutBtn").onclick=logout;
  appEl.querySelectorAll(".tab").forEach(a=>a.onclick=e=>{e.preventDefault();openId=null;view=a.dataset.view;render();});
  appEl.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeDialogs);
  appEl.querySelectorAll(".scrim").forEach(s=>s.addEventListener("click",e=>{if(e.target===s)closeDialogs();}));
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDialogs();});
  appEl.querySelector("#newCreate").onclick=createRelease;
  appEl.querySelector("#rejConfirm").onclick=confirmReject;
  render();
}
const root=()=>document.getElementById("root");
function setTabs(){appEl.querySelectorAll(".tab").forEach(a=>a.classList.toggle("active",a.dataset.view===view||(view==="release"&&a.dataset.view==="dashboard")));}
function openDialog(id,fn){document.getElementById(id).classList.add("show");if(fn)setTimeout(fn,30);}
function closeDialogs(){appEl.querySelectorAll(".scrim").forEach(s=>s.classList.remove("show"));}

async function render(){
  setTabs();
  try{
    if(view==="dashboard")await renderDashboard();
    else if(view==="release")await renderRelease();
    else await renderHistory();
  }catch(e){root().innerHTML=`<div class="emptyrow">${esc(e.message)}</div>`;}
}

async function renderDashboard(){
  const rs=await api("/releases");
  const open=rs.filter(r=>r.state==="ok"||r.state==="hold").length;
  const decided=rs.length-open;
  const cc=document.getElementById("relCount");if(cc)cc.textContent=open;
  root().innerHTML=`
   <div class="phead"><div><h1>Releases</h1><p>A release can be approved only once every check has cleared.</p></div><div class="spacer"></div><button class="btn primary" id="newBtn">${S.plus} New release</button></div>
   <div class="box">
     <div class="box-head">${S.issue} <b>${open}</b> open <span style="color:var(--fg-muted)">·</span> ${S.check} <b>${decided}</b> decided</div>
     ${rs.length?rs.map(r=>`
       <button class="irow" data-open="${r.id}">
         <span class="si ${r.state}">${SI[r.state]}</span>
         <span><span class="ttl">${esc(r.version)}</span><span class="sub mono">${esc(r.desc)} · opened by ${esc(r.requestedBy)}${(r.state==="ok"||r.state==="hold")?` · ${r.openCount} ${r.openCount===1?"check":"checks"} open`:""}</span></span>
         <span class="right"><span class="State ${r.state} sm">${LABEL[r.state]}</span></span>
       </button>`).join(""):`<div class="emptyrow">No releases yet. Create your first one.</div>`}
   </div>`;
  document.getElementById("newBtn").onclick=()=>openDialog("newScrim",()=>document.getElementById("nver").focus());
  root().querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{openId=+b.dataset.open;view="release";render();});
}

async function renderRelease(){
  const r=await api("/releases/"+openId);
  const st=r.state, bl=r.blockers, decided=st==="done"||st==="closed";
  const mTitle={ok:"All checks have passed",hold:"Some checks haven’t cleared yet",done:"Release approved",closed:"Release rejected"}[st];
  let mSub;
  if(st==="ok")mSub="Every defect, test and checklist item has cleared. This release is ready to approve.";
  else if(st==="hold")mSub=`${bl.length} ${bl.length===1?"check is":"checks are"} blocking approval.`;
  else if(st==="done")mSub=`Approved by ${esc(r.decision.by)}.`;
  else mSub=`Rejected by ${esc(r.decision.by)}. Reason: ${esc(r.decision.reason||"none given")}`;
  const mIc={ok:S.check,hold:S.alert,done:S.merged,closed:S.xCircle}[st];
  root().innerHTML=`
   <button class="backlink" id="backBtn">${S.back} Back to releases</button>
   <div class="ihead"><h1><span class="mono">${esc(r.version)}</span> <span class="num">#${r.id}</span></h1>
     <div class="statusline"><span class="State ${st}">${SI[st]} ${LABEL[st]}</span><span><b>${esc(r.requestedBy)}</b> opened this release · ${esc(r.desc)}</span></div></div>
   <div class="merge ${st}">
     <div class="m-top"><span class="m-ic">${mIc}</span><div style="flex:1"><div class="m-title">${mTitle}</div><div class="m-sub">${mSub}</div>
       ${bl.length&&!decided?`<ul class="checks">${bl.map(b=>`<li><span class="x">${S.xCircle}</span><span>${esc(b.text)}</span><span class="k">${esc(b.kind)}</span></li>`).join("")}</ul>`:""}</div></div>
     ${!decided?`<div class="m-foot"><button class="btn primary" id="approveBtn" ${st==="ok"?"":"disabled"} title="${st==="ok"?"":"Clear every check first"}">${S.merged} Approve release</button><button class="btn danger" id="rejectBtn">Reject</button></div>`:""}
   </div>
   ${group("Defects",r.bugs.length,r.bugs.map(b=>`
     <div class="lrow ${b.resolved?"cleared":""}"><span class="lic">${b.resolved?S.checkCircle:S.issue}</span>
       <span><span class="nm">${esc(b.title)}</span><span class="meta">assigned to ${esc(b.assignee||"nobody")}</span></span>
       <span class="label ${b.severity}">${esc(b.severity)}</span>
       ${b.resolved?`<span class="statetxt good">Resolved</span>`:`<button class="btn sm" data-resolve="${b.id}">Resolve</button>`}</div>`).join("")||emptyRow("No defects linked."),
     `<input type="text" id="bugTitle" class="grow" placeholder="Defect title"><select id="bugSev"><option>Critical</option><option>Major</option><option selected>Minor</option></select><input type="text" id="bugWho" placeholder="Assignee" style="width:130px"><button class="btn" id="addBug">${S.plus} Link defect</button>`)}
   ${group("Tests",r.tests.length,r.tests.map(t=>`
     <div class="lrow code ${t.passed?"cleared":""}"><span class="lic" style="${t.passed?"":"color:var(--danger)"}">${t.passed?S.checkCircle:S.xCircle}</span>
       <span><span class="nm">${esc(t.name)}</span></span><span class="statetxt ${t.passed?"good":"open"}">${t.passed?"Passing":"Failing"}</span>
       ${t.passed?`<span></span>`:`<button class="btn sm" data-pass="${t.id}">Mark passing</button>`}</div>`).join("")||emptyRow("No tests recorded."),
     `<input type="text" id="testName" class="grow code-in" placeholder="test-name"><button class="btn" id="addTest">${S.plus} Add test</button>`)}
   ${group("Checklist",r.checklist.length,r.checklist.map(c=>`
     <div class="lrow ${c.done?"cleared":""}"><span class="lic">${c.done?S.checkCircle:S.circle}</span>
       <span><span class="nm">${esc(c.text)}</span></span><span class="statetxt ${c.done?"good":"muted"}">${c.done?"Done":"To do"}</span>
       ${c.done?`<span></span>`:`<button class="btn sm" data-done="${c.id}">Complete</button>`}</div>`).join("")||emptyRow("No checklist items."),
     `<input type="text" id="chkText" class="grow" placeholder="Checklist item"><button class="btn" id="addChk">${S.plus} Add item</button>`)}`;
  const base="/releases/"+r.id;
  document.getElementById("backBtn").onclick=()=>{view="dashboard";render();};
  const ab=document.getElementById("approveBtn");if(ab)ab.onclick=()=>act(base+"/approve","POST");
  const rb=document.getElementById("rejectBtn");if(rb)rb.onclick=()=>openDialog("rejScrim",()=>document.getElementById("rreason").focus());
  root().querySelectorAll("[data-resolve]").forEach(b=>b.onclick=()=>act(base+"/bugs/"+b.dataset.resolve+"/resolve","POST"));
  root().querySelectorAll("[data-pass]").forEach(b=>b.onclick=()=>act(base+"/tests/"+b.dataset.pass+"/pass","POST"));
  root().querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>act(base+"/checklist/"+b.dataset.done+"/complete","POST"));
  document.getElementById("addBug").onclick=()=>{const t=document.getElementById("bugTitle").value.trim();if(!t)return;act(base+"/bugs","POST",{title:t,severity:document.getElementById("bugSev").value,assignee:document.getElementById("bugWho").value.trim()});};
  document.getElementById("addTest").onclick=()=>{const n=document.getElementById("testName").value.trim();if(!n)return;act(base+"/tests","POST",{name:n});};
  document.getElementById("addChk").onclick=()=>{const t=document.getElementById("chkText").value.trim();if(!t)return;act(base+"/checklist","POST",{text:t});};
}
function group(title,n,rows,addFields){return `<div class="group"><div class="g-title">${title} <span class="c tnum">${n}</span></div><div class="box">${rows}<div class="add">${addFields}</div></div></div>`;}
function emptyRow(t){return `<div class="emptyrow">${t}</div>`;}
async function act(path,method,body){try{await api(path,method,body);await renderRelease();}catch(e){alert(e.message);}}

async function renderHistory(){
  const log=await api("/activity");
  root().innerHTML=`<div class="phead"><div><h1>Activity</h1><p>A record of who changed what, and when.</p></div></div>
   <div class="box ledger">${log.length?log.map(e=>`<div class="e"><span class="ic">${S.circle}</span><span class="a"><b>${esc(e.who)}</b> ${esc(e.action)}</span><span class="when">${timeAgo(e.when)}</span></div>`).join(""):`<div class="emptyrow">No activity yet.</div>`}</div>`;
}

async function createRelease(){
  const v=document.getElementById("nver").value.trim();if(!v){document.getElementById("nver").focus();return;}
  const d=document.getElementById("ndesc").value.trim();
  try{const r=await api("/releases","POST",{version:v,desc:d});document.getElementById("nver").value="";document.getElementById("ndesc").value="";closeDialogs();openId=r.id;view="release";render();}
  catch(e){alert(e.message);}
}
async function confirmReject(){
  const reason=document.getElementById("rreason").value.trim();
  try{await api("/releases/"+openId+"/reject","POST",{reason});document.getElementById("rreason").value="";closeDialogs();renderRelease();}
  catch(e){alert(e.message);}
}

if(token&&user)renderApp(); else renderAuth();
</script>
</body>
